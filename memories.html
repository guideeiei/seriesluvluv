<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memories 📸</title>

<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="page-wrapper">

  <div class="memories-header fade-up">
    <p class="page-eyebrow">every moment</p>
    <h1 class="page-title">Memories 📸</h1>
  </div>

  <!-- MONTH FILTER TABS -->
  <div class="month-tabs fade-up fade-up-1">
    <span class="month-pill active" onclick="showMonth('all', this)">All</span>
    <span class="month-pill" onclick="showMonth('november', this)">November</span>
    <span class="month-pill" onclick="showMonth('december', this)">December</span>
    <span class="month-pill" onclick="showMonth('january', this)">January</span>
    <span class="month-pill" onclick="showMonth('february', this)">February</span>
    <span class="month-pill" onclick="showMonth('march', this)">March</span>
    <span class="month-pill" onclick="showMonth('april', this)">April</span>
    <span class="month-pill" onclick="showMonth('may', this)">May</span>
  </div>

  <!-- ── NOVEMBER ── -->
  <div class="month-group fade-up fade-up-2" data-month="november">
    <p class="menu-section-label" style="padding: 0 20px; margin-bottom: 8px;">November</p>
    <div class="photo-grid">
      <!-- Large hero photo -->
      <div class="photo-cell large">
        <img src="nov/2-November-1.JPG" alt="November" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">
      </div>
      <!-- Add your November photos below — copy the photo-cell block for each one -->
      <div class="photo-cell">
        <img src="nov/1-November-1.JPG" alt="" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">
      </div>
      <div class="photo-cell">
        <img src="nov/1-November-2.jpeg" alt="" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">
      </div>
      <div class="photo-cell">
        <img src="nov/9-July.jpg" alt="" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">
      </div>
      <div class="photo-cell">
        <img src="nov/12-November.jpeg" alt="" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">
      </div>
      <!-- Add more: <div class="photo-cell"><img src="nov/YOUR.jpg"></div> -->
    </div>
  </div>

  <!-- ── DECEMBER ── -->
  <div class="month-group fade-up fade-up-2" data-month="december" style="margin-top: 24px;">
    <p class="menu-section-label" style="padding: 0 20px; margin-bottom: 8px;">December</p>
    <div class="photo-grid">
      <div class="photo-cell large">
        <img src="dec/YOUR-HERO.jpg" alt="December" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">
      </div>
      <!-- Add December photos here -->
      <div class="photo-cell"><div class="photo-placeholder">📸</div></div>
      <div class="photo-cell"><div class="photo-placeholder">📸</div></div>
    </div>
  </div>

  <!-- ── JANUARY ── -->
  <div class="month-group fade-up fade-up-3" data-month="january" style="margin-top: 24px;">

  <!-- ── FEBRUARY ── -->

    <div class="photo-grid">

        <img src="feb/YOUR-HERO.jpg" alt="February" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">

    </div>

  <!-- ── MARCH ── -->
  <div class="month-group fade-up fade-up-4" data-month="march" style="margin-top: 24px;">
    <p class="menu-section-label" style="padding: 0 20px; margin-bottom: 8px;">March</p>
    <div class="photo-grid">
      <div class="photo-cell large">

  <!-- ── APRIL ── -->

    <p class="menu-section-label" style="padding: 0 20px; margin-bottom: 8px;">April</p>
    <div class="photo-grid">
      <div class="photo-cell large">
        <img src="apr/YOUR-HERO.jpg" alt="April" onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📸</div>'">
      </div>
      <div class="photo-cell"><div class="photo-placeholder">📸</div></div>
      <div class="photo-cell"><div class="photo-placeholder">📸</div></div>
    </div>
  </div>

<script src="script.js"></script>
<script>
function showMonth(month, el) {
  document.querySelectorAll('.month-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.month-group').forEach(g => {
    g.style.display = (month === 'all' || g.dataset.month === month) ? 'block' : 'none';
  });
}
</script>
