<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>For My Love</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">
  <div class="login-left">
    <img src="November/1-November-1.JPG">
  </div>

  <div class="login-right">
    <h2>ใส่วันเกิดเทอคับ 8 ตัวลองเดาดูนะ💗</h2>

    <div id="passwordDisplay" class="password-box"></div>

    <div class="keypad">
      <button onclick="addNum('1')">1</button>
      <button onclick="addNum('2')">2</button>
      <button onclick="addNum('3')">3</button>
      <button onclick="addNum('4')">4</button>
      <button onclick="addNum('5')">5</button>
      <button onclick="addNum('6')">6</button>
      <button onclick="addNum('7')">7</button>
      <button onclick="addNum('8')">8</button>
      <button onclick="addNum('9')">9</button>
      <button onclick="clearPass()">←</button>
      <button onclick="addNum('0')">0</button>
      <button onclick="checkPassword()">OK</button>
    </div>

    <p id="message"></p>
    <button id="nextBtn" class="main-btn" onclick="goHome()" style="display:none">ไปต่อ 💕</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
