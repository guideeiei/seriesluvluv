<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>

<link rel="stylesheet" href="style.css">
</head>

<body class="center-page">

<div class="note-intro">
  💌 Letter for you 💕  
  <br>
  from my heart to yours
</div>
<div class="notes-grid">
  <img src="June/27-June-1.jpg">
  <img src="August/26-August.JPG">
  <img src="November/2-November-2.JPG">
</div>

<button class="main-btn letter-btn" onclick="openNote()">📩 Open Letter</button>

<div class="popup" id="popup">
  <div class="popup-content">
    <p>
      From the moment we met in June,  
      to the day we became a couple on November 1st,  
      every moment with you has made me truly happy.  
      <br><br>
      Thank you for being my safe place 💕
    </p>
    <button class="main-btn" onclick="closeNote()">Close</button>
  </div>
</div>

<button class="main-btn" onclick="goHome()">⬅ Back</button>

<script src="script.js"></script>
</body>
</html>
