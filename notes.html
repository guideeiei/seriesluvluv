<!DOCTYPE html>
<html>
<head>

<title>Notes</title>

<link rel="stylesheet" href="style.css">

<body class="center-page">

<h2>For You 💌</h2>

<div class="notes-grid">

<button class="main-btn letter-btn" onclick="openNote()">📩 Open Letter</button>

      From the moment we met in June,

      <br><br>
      Thank you for being my safe place 💕

  </div>
</div>

<button class="main-btn" onclick="goHome()">⬅ Back</button>

<script src="script.js"></script>
</body>
