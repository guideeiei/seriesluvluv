<script src="script.js"></script>
<script>
  // Love counter — set your anniversary start date here (YYYY, MM-1, DD)
  const START = new Date(2024, 10, 1); // Nov 1 2024 — adjust!
  function updateCounter() {
    const now = new Date();
    const diff = now - START;
    const days = Math.floor(diff / 86400000);
    const months = Math.floor(days / 30.44);
    document.getElementById('cntDays').textContent = days;
    document.getElementById('cntMonths').textContent = months;
  }
  updateCounter();

  // Music toggle
  const audio = document.getElementById('bgMusic');
  const btn   = document.getElementById('musicToggle');
  function toggleMusic() {
    if (audio.paused) { audio.play(); btn.textContent = '⏸'; }
    else { audio.pause(); btn.textContent = '▶'; }
  }
  // Auto-play on first tap (browser policy)
  document.addEventListener('click', function tryPlay() {
    if (audio.src && audio.paused) { audio.play().then(() => { btn.textContent = '⏸'; }); }
    document.removeEventListener('click', tryPlay);
  }, { once: true });
</script>
